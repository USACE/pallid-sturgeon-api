name: Build

on:
  workflow_call:
    inputs:
        tag-name:
          type: string
          description: tag for the target repo
          required: true
        aws-region:
          type: string
          description: aws region for target repo
          required: true
        aws-account:
          type: number
          description: aws account id
          required: true
        ecr-repository:
          type: string
          description: name of ECR repo
          required: true

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:

  build-images:
    name: Build Images
    runs-on: ubuntu-latest
    permissions:
      actions: write
      attestations: write
      checks: write
      contents: write
      deployments: write
      discussions: write
      id-token: write
      issues: write
      models: read
      packages: write
      pages: write
      pull-requests: write
      security-events: write
      statuses: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        if: env.GHCR_IMAGE
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{inputs.aws-region}}
          role-to-assume: arn:aws-us-gov:iam::${{inputs.aws-account}}:role/github-actions-ecr-object-browser
          output-credentials: true

      - name: Sts GetCallerIdentity
        run: |
          aws sts get-caller-identity
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: "false"

      - name: Build and push
        uses: docker/build-push-action@v6
        id: build-and-push
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{inputs.ecr-repository}}
        with:
          context: .
          file: ./Dockerfile
          tags: ${{env.GHCR_IMAGE}}:${{inputs.tag-name}} $ECR_REGISTRY/$ECR_REPOSITORY:${{inputs.tag-name}}
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new
      - name: ECR Logout
        if: always()
        run: docker logout ${{ steps.login-ecr.outputs.registry }}